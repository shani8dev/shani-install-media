# ShaniOS - Ensure /var/lib/snapd/snap exists and /snap points to it
# Processed by shanios-tmpfiles-snapd.service after var-lib-snapd.mount.

d /var/lib/snapd/snap    0755 root root -
d /var/snap             0755 root root -
# snap-confine's AppArmor profile #includes this directory; the @snapd
# subvolume mounted over /var/lib/snapd hides the package's copy, so without
# it apparmor.service failed at every boot ("Could not open
# '/var/lib/snapd/apparmor/snap-confine'")
d /var/lib/snapd/apparmor/snap-confine 0755 root root -
