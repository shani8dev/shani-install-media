compress="zstd"
add_dracutmodules+=" crypt btrfs plymouth resume "
omit_dracutmodules+=" brltty "
# Generic initramfs, not hostonly: hostonly left uas and usb_storage out of a
# USB-SSD install - root's own driver - so the initqueue waited forever for
# root=UUID=, and a disk moved to another machine (an external SSD) gets the
# drivers and both vendors' microcode it needs. NVIDIA is omitted: its GSP
# firmware alone is 111 MiB (UKI 168 -> 83 MiB) and nothing before switch-root
# needs it - simpledrm draws the splash and the LUKS prompt.
omit_drivers+=" nvidia nvidia_modeset nvidia_uvm nvidia_drm nvidia_peermem "
# The root path, kept explicit in case hostonly is ever turned back on. These
# are modules on the Arch kernel (ahci, xhci, sd_mod, virtio, btrfs are built
# in; dracut adds nvme/vmd itself):
#   USB / Thunderbolt enclosures, SD and eMMC, SATA in IDE mode,
#   Hyper-V / VMware / Xen guests, SAS / RAID HBAs; plus an I2C laptop
#   keyboard, for the LUKS passphrase.
add_drivers+=" uas usb_storage thunderbolt "
add_drivers+=" sdhci sdhci_pci sdhci_acpi mmc_block "
add_drivers+=" ata_piix ata_generic pata_acpi "
add_drivers+=" hv_storvsc vmw_pvscsi xen_blkfront mpt3sas megaraid_sas "
add_drivers+=" i2c_hid_acpi "
early_microcode=yes
#use_fstab=yes
hostonly=no
hostonly_cmdline=no
ro_mnt=yes
uefi=yes
uefi_secureboot_cert="/etc/secureboot/keys/MOK.crt"
uefi_secureboot_key="/etc/secureboot/keys/MOK.key"
uefi_splash_image="/usr/share/systemd/bootctl/splash-shani.bmp"
uefi_stub="/usr/lib/systemd/boot/efi/linuxx64.efi.stub"
