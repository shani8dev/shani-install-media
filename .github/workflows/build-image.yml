name: Build ShaniOS Image (Non-AMI)

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "image_profiles/**"
      - "iso_profiles/**"
      - "config/**"
      - "build.sh"
      - "run_in_container.sh"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Image profile"
        required: true
        default: "gnome"
        type: choice
        options: [cosmic, gnome, plasma, server, shared, kiosk]
      build-type:
        description: "Build type"
        required: false
        default: "iso"
        type: choice
        options: [image, iso, full]

concurrency:
  group: non-ami-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Validate
    uses: shani8dev/shani-ci-commons/.github/workflows/lint.yml@main
    with:
      shellcheck-version: v0.10.0.1
      pre-commit-version: v4.1.0

  build:
    name: Build (${{ github.event.inputs.build-type || 'iso' }} - ${{ github.event.inputs.profile || 'gnome' }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 600
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Pull builder image
        run: docker pull docker.io/shrinivasvkumbhar/shani-builder:latest || true

      - name: Run build
        run: |
          PROFILE="${{ github.event.inputs.profile || 'gnome' }}"
          BUILD_TYPE="${{ github.event.inputs.build-type || 'iso' }}"
          ./run_in_container.sh build.sh "${BUILD_TYPE}" -p "${PROFILE}"
